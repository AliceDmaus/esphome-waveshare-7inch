lvgl:
  log_level: INFO
  color_depth: 16
  bg_color: 0x000000
  bottom_layer:
    bg_image_src: image_background
  # update_when_display_idle nicht aktivieren: führt bei mipi_rgb zu schwarzem Bild

  displays:
    - waveshare_display

  touchscreens:
    - my_touchscreen

  pages:
    - id: main_page
      scrollable: false
      bg_opa: TRANSP

      widgets:
        - label:
            id: time_label
            text: "00:00"
            align: TOP_LEFT
            x: 30
            y: 10
            text_font: roboto_clock_huge
            text_color: 0xFFFFFF

        - label:
            id: date_label
            text: ""
            align: TOP_RIGHT
            x: -30
            y: 50
            text_font: roboto_64
            text_color: 0xDDDDDD

        - obj:
            x: 20
            y: 140
            width: 370
            height: 160
            bg_color: 0x000000
            bg_opa: 60%
            radius: 15
            border_width: 1
            border_color: 0x444444
            border_opa: 100%

        - image:
            id: weather_condition
            src: weather_default
            x: 22
            y: 172

        - label:
            id: temp_aussen
            text: "--"
            x: 130
            y: 180
            text_font: roboto_70
            text_color: 0xFFFFFF

        - obj:
            x: 410
            y: 140
            width: 370
            height: 160
            bg_color: 0x000000
            bg_opa: 60%
            radius: 15
            border_width: 1
            border_color: 0x444444
            border_opa: 100%

        - image:
            src: icon_living_room
            x: 412
            y: 172

        - label:
            id: temp_wohnzimmer
            text: "--"
            x: 520
            y: 180
            text_font: roboto_70
            text_color: 0xFFFFFF

        - obj:
            x: 20
            y: 310
            width: 370
            height: 160
            bg_color: 0x000000
            bg_opa: 60%
            radius: 15
            border_width: 1
            border_color: 0x444444
            border_opa: 100%

        - image:
            src: icon_washing_machine
            x: 22
            y: 342

        - label:
            id: washer_time
            text: "Bereit"
            x: 130
            y: 350
            text_font: roboto_70
            text_color: 0xFFFFFF

        - obj:
            x: 410
            y: 310
            width: 370
            height: 160
            bg_color: 0x000000
            bg_opa: 60%
            radius: 15
            border_width: 1
            border_color: 0x444444
            border_opa: 100%

        - image:
            id: timer_icon
            src: icon_timer
            x: 412
            y: 342
        - label:
            id: timer_timer_label
            text: "00:00"
            x: 520
            y: 350
            text_font: roboto_70
            text_color: 0xFFFFFF
            
        # Alternative Anzeige, wenn Timer nicht läuft
        - image:
            id: alt_clock_icon
            src: icon_electric_meter
            x: 412
            y: 342
        - label:
            id: alt_clock_label
            text: "0 W"
            x: 520
            y: 350
            text_font: roboto_70
            text_color: 0xFFFFFF
