switch:
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - if: {condition: lvgl.is_paused, then: [lvgl.resume, lvgl.widget.redraw]}
      - lvgl.pause: {show_snow: true}
    turn_off_action:
      - if: {condition: lvgl.is_paused, then: [lvgl.resume, lvgl.widget.redraw]}

lvgl:
  on_resume:
    - switch.template.publish:
        id: switch_antiburn
        state: false
