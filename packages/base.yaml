# Hardware, Netzwerk & Logik
esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5min

logger:
  level: WARN
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Waveshare-Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 2
  ota: false

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true

ch422g:
  - id: ch422g_hub

time:
  - platform: homeassistant
    id: esptime
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock


globals:
  # UTC-Epoch, zu dem der HA-Timer abläuft (0 = unbekannt)
  - id: timer_finishes_at
    type: int64_t
    restore_value: no
    initial_value: '0'

  - id: timer_timer_active
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: update_clock
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            auto now = id(esptime).now();
            if (!now.is_valid()) return "00:00";
            static char time_str[8];
            snprintf(time_str, sizeof(time_str), "%02d:%02d", now.hour, now.minute);
            return time_str;
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            auto now = id(esptime).now();
            if (!now.is_valid()) return "";
            static char date_str[16];
            snprintf(date_str, sizeof(date_str), "%02d.%02d.%04d", now.day_of_month, now.month, now.year);
            return date_str;

  - id: update_timer_visibility
    then:
      - lambda: |-
          if (id(timer_timer_active)) {
            lv_obj_add_flag(id(alt_clock_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(alt_clock_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(timer_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(timer_timer_label), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(timer_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(timer_timer_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(alt_clock_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(alt_clock_label), LV_OBJ_FLAG_HIDDEN);
          }

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(timer_timer_active);'
          then:
            - lvgl.label.update:
                id: timer_timer_label
                text: !lambda |-
                  if (!id(esptime).now().is_valid() || id(timer_finishes_at) == 0) return "--:--";

                  int64_t remaining = id(timer_finishes_at) - (int64_t) id(esptime).timestamp_now();
                  if (remaining <= 0) return "Bereit";

                  int hours = remaining / 3600;
                  int mins = (remaining % 3600) / 60;
                  int secs = remaining % 60;

                  static char buf[20];
                  if (hours > 0) {
                    snprintf(buf, sizeof(buf), "%d:%02d:%02d", hours, mins, secs);
                  } else {
                    snprintf(buf, sizeof(buf), "%02d:%02d", mins, secs);
                  }
                  return buf;
button:
  - platform: restart
    name: "Display Neustart"
    id: btn_restart
    entity_category: "config"

switch:
  - platform: safe_mode
    name: "Display Safe Mode"
    id: device_safe_mode
    entity_category: "config"
