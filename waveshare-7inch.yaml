substitutions:
  device_internal_name: waveshare-7inch
  device_friendly_name: Waveshare 7inch
  backlight_pin: GPIO16
  # Conditionally included packages, see https://esphome.io/components/packages/
  enable_debug: "false"  # Set to "true" to enable debug logging
  enable_antiburn: "true"  # Set to "false" to disable antiburn feature
  debug_package: !include packages/debug.yaml
  antiburn_package: !include packages/antiburn.yaml

esphome:
  name: main-display
  friendly_name: Main-Display

  platformio_options:
    board_upload.maximum_ram_size: 524288

  on_boot:
    priority: 600
    then:
      - delay: 500ms
      - script.execute: update_timer_visibility
      - switch.turn_on: old_backlight_switch
      - light.turn_on:
          id: lcdbacklight
          brightness: 100%

image:
  - platform: file
    file: images/background.jpg
    id: image_background
    type: RGB565
